<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CART PAGE</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <img src="cartlogo.png" width="200" height="100" alt="Cart Logo">
    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>Book Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Data Structures and Algorithms</td>
                <td>$35</td>
                <td>2</td>
                <td>$70</td>
            </tr>
            <tr>
                <td>The Guide</td>
                <td>$15</td>
                <td>3</td>
                <td>$45</td>
            </tr>
            <tr>
                <th colspan="4">Total Amount = $115</th>
            </tr>
        </tbody>
    </table>
</body>

</html>
